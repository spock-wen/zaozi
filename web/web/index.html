<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* 首屏设 html lang，跟 zaozi_locale_v1（缺省 zh）。 */
(function () {
  var loc = "zh";
  try {
    var stored = localStorage.getItem("zaozi_locale_v1");
    if (stored === "en" || stored === "zh") loc = stored;
  } catch (e) {}
  document.documentElement.lang = loc === "en" ? "en" : "zh-CN";
})();
</script>
<title>造字人 · 一年里程碑</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E2230">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body data-view="mobile" data-orient="portrait">
<div id="app">

  <header id="topbar">
    <div id="gen-line">第 <span id="gennum">1</span> 代 · 记事人</div>
    <button id="goals-slip" hidden aria-label="目标"></button>
    <div id="topright">
      <span id="bones-chip" title="空骨片用来把这件事刻成事签，也可以交给巫。">骨片 <b id="bonesnum">3</b><span class="sr-only">空骨片用来把这件事刻成事签，也可以交给巫。</span></span>
      <span id="season-chip">春</span>
      <button id="keyhelp-btn" aria-label="键位说明" aria-haspopup="true" aria-expanded="false">?</button>
      <button id="menubtn" aria-label="菜单" aria-haspopup="true" aria-expanded="false">☰</button>
    </div>
  </header>

  <div id="dimrow">
    <div id="dims" class="dims"></div>
  </div>

  <main id="stage">
    <button id="opt-left" class="optbtn" hidden></button>
    <div id="cardcol">
      <div id="dims-desktop" class="dims"></div>
      <div id="cardwrap">
        <article id="card" class="card" tabindex="0">
          <button id="bonecorner" class="bonecorner" aria-label="刻字">刻<i class="bone-badge" aria-hidden="true">−1</i></button>
          <div id="card-art" class="card-art" hidden></div>
          <div class="card-head"><span id="card-season"></span><span class="dot-sep">·</span><span id="card-speaker"></span></div>
          <h2 id="card-title"></h2>
          <p id="card-text"></p>
          <div id="card-drag-hint" class="card-drag-hint" hidden>
            <div id="card-drag-label" class="card-drag-label"></div>
            <div id="card-drag-bar" class="card-drag-bar"><div id="card-drag-fill" class="card-drag-fill"></div></div>
          </div>
          <div id="card-drops" class="card-drops" hidden></div>
        </article>
      </div>
      <div id="gesture-hint"></div>
    </div>
    <button id="opt-right" class="optbtn" hidden></button>
    <div id="coachcol"><div id="coach" hidden></div></div>
  </main>

  <div id="wordbox-bar">
    <div class="wb-handle" id="wb-handle"></div>
    <div id="wordbox"></div>
  </div>

  <footer id="keys"></footer>

  <aside id="sidebar" hidden>
    <button id="sidebar-tab" aria-label="展开侧栏">字录</button>
    <div id="sidebar-body"></div>
  </aside>

  <div id="drawer" hidden><div id="drawer-mask"></div><div id="drawer-body"></div></div>

  <div id="goals-panel" hidden></div>
  <div id="sprout" hidden></div>
  <div id="banner" hidden></div>

  <div id="menu-pop" hidden></div>
  <div id="keyhelp-pop" hidden></div>
  <div id="too-short" hidden>窗口太小，放大窗口更好玩</div>

  <section id="pick" hidden></section>
  <section id="elder" hidden></section>
  <section id="endseq" hidden></section>
  <section id="winter" hidden></section>

  <div id="savedlg" hidden>
    <div id="dlgbox">
      <h3 id="dlgtitle">存档码</h3>
      <p id="dlgmsg" hidden></p>
      <textarea id="dlgtext" rows="6" spellcheck="false"></textarea>
      <div id="dlgbtns">
        <button class="act" id="dlgcopy">复制</button>
        <button class="act" id="dlgapply">导入</button>
        <button class="act" id="dlgclose">关闭</button>
      </div>
    </div>
  </div>

  <div id="rotate-hint" hidden>把手机横过来不如转回竖屏——这一版先只做竖屏。</div>
  <div id="outcome" hidden></div>
  <div id="toast"></div>
  <div id="toast-live" class="sr-only" role="status" aria-live="polite"></div>

  <div id="cutscene" hidden>
    <div id="cut-scrim"></div>
    <div id="cut-card" role="dialog" aria-modal="true" aria-labelledby="cut-speaker">
      <div id="cut-speaker"></div>
      <p id="cut-body"></p>
      <div id="cut-act"><button type="button" id="cut-continue">继续</button></div>
    </div>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div id="sheetmask"></div>
  <section class="sheet-panel" id="sheetpanel" tabindex="-1">
    <div class="sheet-hd"><h2 id="sheet-title">迹</h2><span id="sheet-sub"></span></div>
    <div class="sheet-body" id="sheetbody" tabindex="0" aria-label="迹文全文"></div>
    <div class="sheet-act">
      <span id="sheetmore" hidden>下面还有，往上滑</span>
      <button class="act skip" id="fold" data-do="trace-close">收起</button>
      <button class="act skip" id="skip2" data-do="skip">先不刻</button>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
